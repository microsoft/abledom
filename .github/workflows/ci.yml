name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
          contents: read
          pull-requests: write

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Run tests
        run: pnpm run test

      - name: Check for unstaged changes
        run: |
          git status --porcelain
          git diff-index --quiet HEAD -- || exit 1

  playwright-tools:
    runs-on: ubuntu-latest
    permissions:
          contents: read
          pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        working-directory: tools/playwright
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: tools/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        working-directory: tools/playwright
        run: pnpm run type-check

      - name: Build
        working-directory: tools/playwright
        run: pnpm run build

      - name: Lint
        working-directory: tools/playwright
        run: pnpm run lint

      - name: Format check
        working-directory: tools/playwright
        run: pnpm run format

      - name: Run tests
        working-directory: tools/playwright
        run: pnpm run test

      - name: Check for unstaged changes
        run: |
          git status --porcelain
          git diff-index --quiet HEAD -- || exit 1
